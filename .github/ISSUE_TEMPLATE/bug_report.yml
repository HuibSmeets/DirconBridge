name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much as you can.
  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One sentence describing the problem.
      placeholder: e.g. App crashes when saving an empty form
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make the bug happen again?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Minor (cosmetic or small annoyance)
        - Moderate (feature partly broken, workaround exists)
        - Major (feature unusable)
        - Critical (crash, data loss or security issue)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version or commit are you using?
      placeholder: e.g. 1.4.2
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser / environment
      description: Only if relevant (browser and version, Node version, etc.)
      placeholder: e.g. Chrome 120
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste any relevant logs. This is formatted as code automatically.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or extra context
      description: Drag and drop images here, or add anything else that might help.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this has not been reported yet
          required: true
        - label: I am using the latest version
          required: false
